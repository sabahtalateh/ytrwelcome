    :root {
      color-scheme: light;
    }

    /* the welcome page's frame: same background and outer padding, the form centered in it */

      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      display: grid;

      max-width: 720px;
      height: 520px;
      border: 0;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(32, 33, 36, 0.14);
      background: #fff;
