<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Thumbnail Resizer</title>
  <style>
    :root {
      color-scheme: light;
    }

    /* the welcome page's frame: same background and outer padding, the form centered in it */
    body {
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      display: grid;
      align-content: center;
      justify-items: center;
      padding: 48px 24px;
      background: #f1f3f4;
    }

    /* the welcome page's plate: white, 24px radius, the same shadow, 24px of room around the form */
    .plate {
      width: 100%;
      max-width: 688px; /* the form's own 640px column plus 24px on each side */
      padding: 24px;
      box-sizing: border-box;
      overflow: hidden;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(32, 33, 36, 0.14);
    }

    /* the embed paints its own margins (13px top, 35px sides) and a help icon pinned to its bottom-left
       corner; the frame is oversized and shifted so the margins and the icon's strip fall outside the plate.
       Only the icon's strip is cut at the bottom: the content is ~50px taller for a signed-in viewer
       (the account row), so a tighter cut would clip the footer for them */
    iframe {
      display: block;
      width: calc(100% + 70px);
      height: 640px;
      margin: -13px -35px -60px;
      border: 0;
    }
  </style>
</head>

<body>
  <div class="plate">
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSezCRjKM61YnlHpoV0qvpbSi_8Iq1ZW388StD1MyE404xAhIw/viewform?embedded=true"
            title="Why have you deleted YouTube Thumbnail Resizer?">Loading…</iframe>
  </div>
</body>

</html>
